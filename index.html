,"Publicación en Power BI Service: compartición y actualización automática","Benchmarking sectorial con datos reales de Supersociedades"],herramientas:["Power BI Desktop","Power BI Service","Copilot for Power BI","SIREM / Supersociedades"],pld300:"Visualizar y analizar los datos (25% del examen) — diseño, IA visual, publicación"},{id:5,title:"IA Aplicada a las Finanzas y Proyecto Final Integrador",hours:24,pregunta:"¿Cómo uso la IA para anticipar riesgos, automatizar informes y tomar decisiones más rápido que la competencia?",entregable:"Dashboard financiero gerencial + informe narrativo con IA + sustentación ante Junta Directiva simulada",temas:["IA generativa en finanzas: Copilot, Copilot for Finance y ChatGPT — casos reales de uso","Automatización de informes financieros narrativos con IA: del dato a la recomendación gerencial","Detección de anomalías financieras con IA: patrones atípicos en datos contables","Forecasting financiero asistido por IA: proyección de ventas, flujo de caja y márgenes","Ética, sesgos y gobernanza en el uso de IA para decisiones financieras — marco colombiano","Simulacro PL-300: repaso de dominios, banco de preguntas y estrategias de examen","Clínica de proyectos: retroalimentación individualizada","Proyecto Final: sustentación ante panel evaluador — Junta Directiva simulada"],herramientas:["Copilot for Finance","ChatGPT","Microsoft Copilot","Power BI Service","Microsoft Learn PL-300"],pld300:"Implementar y administrar (15% examen) + simulacro completo de los 4 dominios PL-300"}],c={1:{conceptos:["El EBITDA no es dinero disponible — mide la capacidad operativa antes de que la estructura financiera intervenga. Una empresa puede tener EBITDA positivo y estar en quiebra de liquidez.","El KTNO (Capital de Trabajo Neto Operativo) mide cuánto dinero 'atrapa' la operación. Si el KTNO crece más rápido que las ventas, la empresa destruye caja aunque tenga utilidades.","El FCL (Flujo de Caja Libre) es lo que banqueros e inversionistas miran primero. Si el FCL es positivo y sostenido, la empresa genera valor por sí sola sin depender de financiación externa.","EVA = UODI − (Activos Netos × WACC). Si el resultado es negativo, la empresa destruye valor aunque muestre utilidades en el estado de resultados. Eso es la diferencia entre contabilidad y finanzas.","Power BI no es un Excel mejorado — es un entorno diferente. Los datos viven en un modelo relacional, no en celdas. El salto mental más difícil de este módulo es ese."],taller:"Descarga los estados financieros de 3 empresas de tu sector desde SIREM (supersociedades.gov.co). Calcula en Excel el EBITDA, el KTNO y el FCL de cada una para los últimos 2 años. ¿Cuál genera más valor real? ¿Por qué? Conecta esos mismos datos a Power BI y presenta una tabla comparativa simple con los 3 indicadores por empresa y año.",recurso:"García S., Óscar León (2009). Administración Financiera: Fundamentos y Aplicaciones. Praxis. Cap. 1-3. | Microsoft Learn: Get started with Power BI (learn.microsoft.com/training/modules/get-started-with-power-bi/)",tip:"Si todavía piensas en Excel cuando ves datos, es completamente normal — es donde todos empezamos. El reto del Módulo 1 no es técnico: es mental. Empieza a pensar en 'tablas que se relacionan' en vez de 'rangos con fórmulas'. Esa es la brecha que vas a cruzar."},2:{conceptos:["Power Query transforma los datos antes de que lleguen al modelo. Todo lo que hagas aquí es reproducible y auditable — sin copiar, pegar ni recordar qué hiciste la semana pasada.","El lenguaje M es el código detrás de Power Query. No necesitas escribirlo desde cero, pero entenderlo te permite modificar pasos complejos sin rehacerlos. Es como leer el log de auditoría de tus transformaciones.","El modelo estrella tiene dos tipos de tablas: hechos (transacciones — muchas filas, pocos atributos) y dimensiones (catálogos — pocas filas, muchas descripciones). En finanzas: PyG = tabla de hechos. Plan de cuentas = dimensión.","Una relación incorrecta en el modelo genera resultados silenciosamente equivocados. Un dashboard bonito con un modelo malo es peor que no tener dashboard — da una falsa sensación de control.","La cardinalidad más segura en finanzas es muchos-a-uno: cada transacción apunta a una cuenta, a una fecha, a una empresa. Evita relaciones muchos-a-muchos siempre que puedas."],taller:"Con los estados financieros del Módulo 1, crea en Power Query: (1) una tabla de hechos con las transacciones del Estado de Resultados, (2) una dimensión Tiempo con año, mes, trimestre y nombre del mes, (3) una dimensión Cuenta Contable con código y descripción. Arma el modelo estrella en Power BI y verifica que no haya errores de cardinalidad ni relaciones inactivas no intencionales.",recurso:"Russo, M. & Ferrari, A. (2022). The Definitive Guide to DAX. 2.ª ed. Microsoft Press. Cap. 1-2. | Microsoft Learn: Model data in Power BI (learn.microsoft.com/training/paths/model-data-power-bi/)",tip:"El error más frecuente en este módulo: mezclar datos de diferentes granularidades en la misma tabla de hechos. Si tienes datos diarios de ventas y datos mensuales de presupuesto, son dos tablas de hechos separadas. Mezclarlos produce totales incorrectos que nadie detecta hasta que el gerente hace una pregunta incómoda en la Junta Directiva."},3:{conceptos:["DAX evalúa en contexto. La misma fórmula puede dar resultados diferentes dependiendo del filtro activo en ese momento — esto no es un error, es exactamente el poder del lenguaje.","CALCULATE es la función más importante de DAX. Modifica el contexto de filtro. Sin entender CALCULATE, no puedes calcular variaciones año a año ni comparativos presupuesto vs. real.","Las medidas no existen en el modelo — se calculan en el momento en que un visual las necesita. Por eso respetan el contexto: si filtras por empresa, la medida se calcula solo para esa empresa.","EVA en DAX: =DIVIDE([UODI], 1) - [Activos_Netos_Promedio] * [WACC]. Si tu modelo está bien armado, esta medida devuelve el EVA correcto para cualquier período y empresa que selecciones.","TOTALYTD, SAMEPERIODLASTYEAR y DATEADD son las tres funciones de tiempo que más valor dan en reportes financieros gerenciales. Con ellas construyes el 80% de los comparativos que pide cualquier junta."],taller:"Sobre el modelo del Módulo 2, construye estas medidas DAX: (1) Margen EBITDA %, (2) KTNO = Cartera + Inventario − Proveedores, (3) FCL = EBITDA − ΔKTNO − Capex, (4) EVA = UODI − (Activos Netos Promedio × WACC). Crea un visual de tarjeta con comparativo vs. año anterior para cada indicador usando CALCULATE + SAMEPERIODLASTYEAR. Los 4 indicadores deben cambiar correctamente cuando filtras por empresa o período.",recurso:"Russo, M. & Ferrari, A. (2022). The Definitive Guide to DAX. Cap. 4-7 (CALCULATE y contextos de evaluación). | SQLBI.com: sección DAX Patterns — especialmente 'Year-over-year' y 'Running total'.",tip:"No memorices funciones DAX — entiende el contexto. Cuando algo no funciona, hazte siempre esta pregunta: '¿Qué filtros están activos en este momento y cómo afectan mi medida?' La respuesta casi siempre revela el problema en menos de 2 minutos. ChatGPT también depura DAX muy bien si le pegas la medida y el error exacto."},4:{conceptos:["Un dashboard financiero debe responder una pregunta, no mostrar todo lo que sabes. Si el gerente necesita más de 2 minutos para entenderlo, el diseño está fallando.","El principio de diseño más importante: el ojo sigue al contraste. Lo que quieres que vean primero debe ser lo más contrastante de la página — no necesariamente el más colorido ni el más grande.","Los semáforos (rojo/amarillo/verde) son útiles solo si el umbral es explícito y acordado. Define la regla desde el inicio: ¿cuándo es rojo el EVA? ¿Con qué valor de referencia? ¿El WACC del sector o el de la empresa?","Power BI Service permite que el dashboard se actualice automáticamente. Una vez configurado, el gerente abre el navegador y los datos ya están actualizados — sin que nadie haga nada manualmente.","Q&A de Power BI entiende preguntas en español. 'Muéstrame el margen EBITDA por mes del último año para Empresa X' genera un visual automáticamente. Ese momento en una reunión de Junta Directiva vale más que cualquier presentación estática."],taller:"Con el modelo y las medidas de los módulos anteriores, construye el dashboard financiero gerencial completo: Página 1 — Rentabilidad (márgenes, variaciones YoY, tendencia mensual). Página 2 — Gestión del Valor (EVA, FCL y KTNO con semáforos según umbrales definidos por ti). Página 3 — Resumen Ejecutivo (máximo 4 KPIs, máximo 1 gráfico, máximo 2 tablas). Publica el informe en Power BI Service y comparte el enlace.",recurso:"Few, S. (2012). Show Me the Numbers: Designing Tables and Graphs to Enlighten. 2.ª ed. Analytics Press. Cap. 2-4. | Microsoft Learn: Publish and share in Power BI (learn.microsoft.com/training/modules/publish-share-power-bi/)",tip:"Antes de agregar cualquier visual, hazte esta pregunta: '¿Qué decisión va a tomar el gerente con este gráfico?' Si no tienes una respuesta concreta, el visual no debe estar ahí. El dashboard más efectivo que he visto en una Junta Directiva tenía solo 4 elementos. Cuatro. Y todos respondían una pregunta específica."},5:{conceptos:["Copilot for Finance no reemplaza al analista financiero — amplifica lo que el analista ya sabe hacer. Si no entiendes el KTNO, Copilot tampoco te lo va a explicar bien. El conocimiento financiero sigue siendo tuyo.","Los informes narrativos con IA son más rápidos, pero pueden ser genéricos o incluso incorrectos en los números. Tu valor como especialista está en el prompt: un prompt preciso produce una narrativa útil. Un prompt vago produce texto bonito que no dice nada.","El forecasting en Power BI usa suavizamiento exponencial. Es suficiente para tendencias de ventas a corto plazo; no reemplaza un modelo de proyección financiera estructurado para valoración.","La ética en IA financiera no es filosofía de sobremesa — es riesgo operacional concreto. Un modelo que discrimina por zona geográfica al otorgar créditos tiene consecuencias regulatorias bajo la Ley 1581 de 2012 y las normas de la SFC.","El examen PL-300 tiene 4 dominios: Preparar datos (35%), Modelar (25%), Visualizar (25%), Implementar (15%). Los dos primeros concentran más del 60% del examen — son los módulos 2 y 3 de este programa."],taller:"Proyecto Final — tres partes: (1) Toma el dashboard del Módulo 4 y genera con ChatGPT una narrativa ejecutiva de máximo 2 páginas que explique los resultados financieros de tu empresa-caso. Verifica cada cifra que cite la IA. (2) Incorpora el informe narrativo como una página de 'Resumen Ejecutivo con IA' en tu dashboard. (3) Prepara una presentación de 10 minutos para sustentar ante el panel evaluador como si fuera la Junta Directiva real de esa empresa. Lleva 3 recomendaciones de gestión respaldadas por los datos.",recurso:"Microsoft Learn: AI features in Power BI (learn.microsoft.com/power-bi/create-reports/copilot-introduction). | PL-300 Exam Study Guide: learn.microsoft.com/credentials/certifications/data-analyst-associate/ | García S., OLG — Cap. 8 (Gestión del valor para la presentación ante Junta)",tip:"Para la sustentación final: no leas el dashboard, cuéntalo. La Junta Directiva no quiere saber cómo funciona Power BI — quiere saber qué significa el EVA negativo y qué harías tú al respecto. Practica con alguien que no sepa nada del proyecto y pídele que te interrumpa con preguntas. Si puedes responderle a él, puedes responderle al panel."}},d={1:{objetivo:"Que el estudiante diferencie el análisis financiero tradicional del basado en datos y conecte los indicadores de valor OLG con la lógica de KPIs en Power BI.",secuencia:["Sesión 1 (4h): Abre con la pregunta '¿Cuánto tiempo gastaste la última vez buscando un dato financiero para una decisión?' — los estudiantes comparten casos reales. Luego explica el ciclo del dato financiero. Cierra con demo en vivo de descarga desde SIREM y primera conexión a Power BI.","Semana 1-2 (asíncrona): Los estudiantes descargan estados financieros de su empresa o sector. Foro de discusión obligatorio: ¿Qué encontraste en los datos de Supersociedades que no esperabas?","Sesión 2 (4h): Workshop del marco OLG — calcula EBITDA, KTNO, FCL y EVA en Excel con datos reales de una empresa colombiana conocida. Luego abre Power BI y replica el mismo cálculo. El contraste visual entre ambos entornos es el momento de aprendizaje."],errores:["Confunden EBITDA con FCL — dedica 15 minutos a un ejemplo donde la empresa tiene EBITDA positivo y FCL negativo (empresa que crece rápido y destruye caja por KTNO).","Intentan construir fórmulas en Power BI como si fueran celdas de Excel — insiste: en Power BI no trabajas sobre celdas, trabajas sobre el modelo.","Descargan datos de SIREM en formato incorrecto o con caracteres especiales — muestra en clase cómo detectar y limpiar estos problemas antes de importar."],tips:["Usa empresas colombianas reales y reconocidas para los ejemplos (Grupo Éxito, Bancolombia, Grupo Nutresa) — la familiaridad reduce la curva de abstracción significativamente.","El marco OLG es el diferenciador académico del programa respecto a toda la competencia. No lo trates como un tema más — es el hilo conductor de los 5 módulos.","Si algún estudiante ya maneja Power BI, ponlo como monitor técnico en los laboratorios. Enseñar consolida el aprendizaje mejor que cualquier ejercicio individual."],evaluacion:"Entregable 1: Dataset estructurado + documento de 1 página explicando qué significa el KTNO de la empresa elegida y cómo afecta su FCL. Criterios: calidad del modelo de datos (40%), precisión del análisis OLG (40%), claridad de la narrativa (20%). Rechazar trabajos que no identifiquen correctamente la diferencia entre EBITDA y FCL."},2:{objetivo:"Que el estudiante construya un modelo relacional financiero funcional en Power BI que sea reproducible, documentado y con las relaciones correctas para soportar todos los cálculos DAX del Módulo 3.",secuencia:["Sesión 3 (4h): Empieza con los datos 'sucios' del Módulo 1 — muestra en vivo cómo Power Query los limpia paso a paso. Explica cada transformación como si fuera un proceso de auditoría: todo tiene por qué y todo queda registrado.","Semana 3-4 (asíncrona): Laboratorio guiado — semana 3: construir la dimensión Tiempo correctamente (marcada como tabla de fechas). Video-tutorial de 25 min + ejercicio práctico con entrega de captura del modelo.","Sesión 4 (4h): Armado del modelo estrella en vivo. El docente muestra el modelo roto (sin relaciones o con relaciones incorrectas) y los estudiantes proponen cómo corregirlo antes de que el docente lo haga. El debate colectivo es el aprendizaje."],errores:["Mezclan datos de diferentes granularidades (diarios y mensuales) en la misma tabla de hechos — muestra siempre el ejemplo concreto de cómo esto rompe los totales en DAX.","Crean relaciones muchos-a-muchos sin entender las consecuencias — dedica 20 min específicos a mostrar qué pasa con los totales cuando la cardinalidad es incorrecta.","Omiten marcar la dimensión Tiempo como 'tabla de fechas' — sin este paso, las funciones de inteligencia de tiempo en DAX no funcionan."],tips:["El ejercicio más efectivo del programa completo: dale a los estudiantes un archivo Excel desastroso (columnas mezcladas, fechas en texto, filas en blanco, monedas mezcladas) y pídeles que lo limpien con Power Query. El dolor de limpiar datos malos produce aprendizaje duradero.","Muestra la diferencia en tamaño de archivo .pbix entre un modelo bien estructurado y uno mal estructurado — el modelo correcto puede ser hasta 10 veces más liviano. El impacto visual es memorabile.","Usa la analogía contable que todos entienden: el modelo estrella es como el plan de cuentas — cada dato tiene su lugar y sus relaciones están definidas desde el diseño."],evaluacion:"Entregable 2: Archivo .pbix + diagrama del modelo (captura de pantalla de la vista de modelo) + documento de media página explicando cada relación y su cardinalidad. Test de validación del docente: aplica un filtro de empresa y otro de período — el margen bruto debe cambiar correctamente. Si no cambia o da error, el entregable no pasa."},3:{objetivo:"Que el estudiante calcule correctamente los 4 indicadores de valor de OLG en DAX y que los resultados sean sensibles a filtros de tiempo y empresa, validando el poder de CALCULATE y la inteligencia de tiempo.",secuencia:["Sesión 5 (4h): Abre escribiendo CALCULATE en el lienzo de medidas y pregunta: '¿Por qué los parámetros van separados así?' — la discusión sobre la lógica de contexto guía toda la sesión. No vayas a la fórmula directamente; llega a ella por el razonamiento.","Semana 5-6 (asíncrona): Laboratorio gradual — semana 5: medidas básicas (SUM, DIVIDE, ratios de liquidez). Semana 6: inteligencia de tiempo (TOTALYTD, SAMEPERIODLASTYEAR). Foro de preguntas activo con respuesta garantizada en 24h.","Sesión 6 (4h): La sesión estrella del programa — cálculo en vivo del EVA en DAX. El docente construye la UODI, el WACC simplificado y los activos netos paso a paso. El EVA aparece en pantalla con datos reales colombianos. Este es el momento que diferencia este programa de cualquier curso genérico de Power BI."],errores:["Usan SUM en el visual directamente en vez de crear medidas — explica por qué una agregación implícita siempre suma el total y una medida explícita respeta el contexto del filtro.","Se confunden con la lógica AND de múltiples argumentos en CALCULATE — muestra casos donde dos filtros se acumulan vs. donde uno anula al otro.","Las funciones de tiempo dan error porque la dimensión Tiempo no está marcada como 'tabla de fechas' — verificar esto antes de la sesión 6 con cada estudiante."],tips:["El momento más impactante del programa: cuando el EVA calculado en DAX coincide exactamente con el que un estudiante tenía en Excel tras 2 horas de trabajo — y el de DAX tardó 3 minutos y responde a cualquier filtro. Planifica ese momento con una empresa de ejemplo preparada.","Crea un banco compartido de medidas DAX financieras en el foro de Moodle — los estudiantes contribuyen medidas y todos las pueden reutilizar. Genera comunidad de práctica y ahorra tiempo en módulos posteriores.","Enseña a usar ChatGPT para depurar DAX desde el inicio: pega la medida rota + el mensaje de error exacto en ChatGPT y pide que explique qué está fallando. El 80% de los errores se resuelven así en menos de 2 minutos."],evaluacion:"Entregable 3: Archivo .pbix con las 4 medidas de valor (EBITDA, KTNO, FCL, EVA) operativas. Validación del docente — test de 3 filtros: (1) filtra un año específico, (2) filtra una empresa específica, (3) aplica ambos filtros. Los 4 indicadores deben cambiar correctamente en los 3 escenarios. Si alguno no responde a un filtro, el entregable requiere corrección."},4:{objetivo:"Que el estudiante produzca un dashboard financiero que cualquier directivo pueda leer sin capacitación previa, comunicando una historia de decisión — no solo una colección de gráficos.",secuencia:["Sesión 7 (4h): Abre con 2 dashboards en paralelo — uno sobrecargado de visuals y colores, uno minimalista con 4 KPIs. Pregunta: '¿Cuál preferiría ver su CEO a las 7am antes de una Junta Directiva?' La discusión de 10 minutos guía todo el diseño del módulo.","Semana 7-8 (asíncrona): Cada estudiante construye su página de rentabilidad. Foro de revisión de pares obligatoria: cada estudiante comenta el dashboard de otro aplicando la guía de diseño visual. La retroalimentación entre pares es más efectiva que solo la del docente.","Sesión 8 (4h): Demo en vivo de storytelling financiero con bookmarks y navegación guiada. El docente cuenta una historia financiera completa usando solo Power BI — sin PowerPoint. Los estudiantes replican con sus datos de empresa-caso."],errores:["Saturan la página con más de 7 visuales — aplica la regla del puño: si no cabe todo lo importante en una pantalla de laptop sin hacer scroll, hay demasiado.","Usan colores sin propósito financiero — rojo no siempre significa malo en finanzas (puede ser un gasto planeado). Define una leyenda de colores estándar al inicio del módulo.","El dashboard no tiene contexto de fecha ni título de período — el gerente abre el informe y no sabe si está viendo datos de este mes o del año pasado."],tips:["El ejercicio de diseño más efectivo: pídeles que reduzcan su dashboard a UNA sola página con máximo 4 KPIs. La restricción fuerza decisiones de diseño que ninguna explicación logra. Lo que eligen conservar revela su comprensión financiera.","Invita a un gerente financiero local o exalumno a ver los dashboards durante 5 minutos antes de la sesión 8, sin explicaciones previas. Su retroalimentación espontánea es la evaluación más honesta que van a recibir.","El momento de Q&A en español es uno de los más impactantes del programa. Prepara la demo con cuidado: 'Muéstrame el margen EBITDA del último trimestre' debe generar el visual correcto en 3 segundos. Ese momento cambia la percepción del valor de Power BI."],evaluacion:"Entregable 4: Dashboard publicado en Power BI Service con 3 páginas. Criterios: claridad visual y diseño (25%), corrección de los indicadores (30%), uso de narrativa y contexto (25%), publicación funcional en Service accesible para el docente (20%). Un dashboard técnicamente correcto pero visualmente confuso no puede superar el 75%."},5:{objetivo:"Que el estudiante integre IA generativa en su flujo de análisis financiero y sustente con autoridad sus hallazgos ante un panel evaluador que actúa como Junta Directiva exigente y no complaciente.",secuencia:["Sesión 9 (4h): Demo en vivo de Copilot for Finance generando una narrativa del Estado de Resultados. Luego análisis colectivo: ¿qué dice bien la IA? ¿qué dice mal? ¿qué agregarías que la IA no puede agregar? La discusión establece el rol correcto de la IA como amplificador, no como sustituto.","Semana 9-10 (asíncrona): Clínica individual de proyectos. Cada estudiante comparte su archivo .pbix en el foro. El docente da retroalimentación específica en video corto (máx. 3 min por estudiante). No hay retroalimentación genérica — cada video menciona el nombre del estudiante y un elemento específico de su trabajo.","Sesión 10 (4h): Simulacro PL-300 (40 preguntas, 60 minutos). Revisión colectiva de las 10 preguntas con mayor tasa de error. Sustentaciones finales ante panel evaluador — máximo 6 estudiantes por sesión."],errores:["Confían en la narrativa de IA sin verificar los números — la IA puede citar una cifra incorrecta con total confianza. Muestra un ejemplo concreto de esto antes de que lo descubran en la sustentación.","En la sustentación, leen el dashboard en vez de interpretarlo — el panel va a interrumpir y preguntar. Quien solo lee no puede responder.","No preparan respuestas para preguntas financieramente exigentes — haz role-play en la sesión 9 con preguntas difíciles: '¿Por qué el EVA es negativo si tenemos utilidades?' '¿Qué haría usted con el KTNO en el segundo semestre?'"],tips:["El panel evaluador funciona mejor cuando las preguntas están preparadas pero se entregan sin aviso durante la sustentación. Los estudiantes no saben qué pregunta les toca — eso es más cercano a una Junta Directiva real.","Invita a un directivo financiero local o exalumno como miembro del panel — la presencia de alguien del mundo real eleva el nivel de compromiso y la calidad de las sustentaciones de forma significativa.","El momento cumbre del programa: cuando un estudiante responde '¿qué haría con este EVA negativo?' con una propuesta concreta de gestión respaldada en sus datos. Eso es exactamente el objetivo del certificado — y se nota."],evaluacion:"Proyecto Final (100% del Módulo 5): Dashboard integrado (40%) + informe narrativo con IA verificado (20%) + sustentación ante panel (40%). En la sustentación: dominio financiero del análisis (40%), dominio técnico de Power BI demostrado en respuestas (30%), calidad de la comunicación gerencial (30%). Un estudiante que no puede responder preguntas del panel sobre sus propios indicadores no aprueba la sustentación, independientemente de la calidad visual del dashboard."}},f=[{section:"Configuración General del Aula",items:[{icon:"⚙️",t:"Nombre del curso",d:"Certificado en Analítica Financiera, Power BI e IA — EGFI UNIMINUTO"},{icon:"📐",t:"Formato de curso",d:"Formato por Temas — 6 secciones (Sección 0: Bienvenida + Secciones 1-5: un módulo por sección)"},{icon:"👥",t:"Modo de grupo",d:"Grupos separados — un grupo por cohorte de ingreso"},{icon:"🔐",t:"Matriculación",d:"Matrícula manual + clave de inscripción diferente por cohorte. El docente matricula a los estudiantes en los primeros 3 días."},{icon:"📊",t:"Calificación máxima",d:"100 puntos. Escala numérica 0-100. Aprobación: 70 puntos. La escala NO es por letras para facilitar la exportación de notas."},{icon:"✅",t:"Rastreo de finalización",d:"Habilitado. Cada actividad tiene condición de finalización configurada. El estudiante ve su progreso en tiempo real."}]},{section:"Sección 0 — Bienvenida y Orientación del Programa",items:[{icon:"📢",t:"Foro de presentación",d:"Actividad: Foro. Tipo: Discusión simple. Pregunta: ¿Por qué te matriculaste y qué empresa o sector analizarás durante el programa? Participación obligatoria antes de acceder al Módulo 1."},{icon:"🎬",t:"Video de bienvenida del docente",d:"Recurso: Archivo de video (máx. 8 min). El docente presenta el programa, los 5 entregables progresivos, la empresa-caso que usará en sus demos y el mapa de ruta al certificado PL-300."},{icon:"📋",t:"Guía del estudiante (PDF descargable)",d:"Recurso: Archivo PDF. Contiene: calendario de sesiones síncronas, criterios de evaluación módulo por módulo, política de entregas tardías, política de IA como asistente, contacto del docente."},{icon:"🔗",t:"Panel de acceso a herramientas",d:"Etiqueta HTML con links directos: descarga Power BI Desktop, acceso SIREM Supersociedades, Microsoft Learn PL-300, canal Discord del grupo, repositorio compartido de archivos .pbix de ejercicios."},{icon:"📅",t:"Calendario sincrónico",d:"Recurso: Tabla HTML integrada en etiqueta. Fechas, horarios y links de acceso a BigBlueButton para las 10 sesiones síncronas del programa."}]},{section:"Estructura de cada Módulo (Secciones 1 a 5)",items:[{icon:"📌",t:"Etiqueta de introducción del módulo",d:"Pregunta gerencial del módulo (texto grande, en negrilla), objetivo de aprendizaje, mapa de ruta del módulo (qué se hace en qué semana), indicador de horas síncronas y asíncronas. Visible al abrir la sección sin hacer clic en nada."},{icon:"🎥",t:"Sesiones síncronas (2 por módulo)",d:"Actividad: BigBlueButton (o MS Teams según configuración institucional). Programadas con 2 semanas de anticipación. Grabación habilitada y automáticamente disponible en 24h. Link de acceso visible 30 min antes del inicio."},{icon:"📖",t:"Material conceptual del módulo",d:"Recurso: Libro de Moodle (capítulos navegables). Contiene: marco conceptual con ejemplos de empresas colombianas, definiciones clave, fórmulas financieras con interpretación, conexión explícita con el dominio PL-300 correspondiente."},{icon:"🎞️",t:"Videos de práctica asíncronos",d:"Recurso: Playlist de 3-4 videos cortos (10-15 min c/u). Estructura fija: Video 1 — demostración completa en Power BI; Video 2 — paso a paso del taller; Video 3 — resolución de los 3 errores más comunes; Video 4 (opcional) — conceptos financieros de soporte."},{icon:"🧪",t:"Taller práctico — Entregable del módulo",d:"Actividad: Tarea. Entrega: archivo .pbix + documento Word con análisis. Calificación avanzada con rúbrica visible para el estudiante desde antes de comenzar. Retroalimentación garantizada en 5 días hábiles. Los entregas tardías tienen penalización del 10% por día hábil, máximo 3 días."},{icon:"💬",t:"Foro de dudas técnicas",d:"Actividad: Foro de preguntas y respuestas. Política pública: si un compañero responde correctamente antes que el docente, el docente reconoce la respuesta y agrega valor. La participación activa en foros suma hasta 2 puntos de bonificación sobre la nota final."},{icon:"🧠",t:"Cuestionario de autoevaluación",d:"Actividad: Cuestionario. 10 preguntas de opción múltiple + 2 de respuesta corta. Intentos ilimitados. Sin calificación. Retroalimentación inmediata al responder. Propósito: verificar comprensión antes de avanzar al siguiente módulo."},{icon:"📚",t:"Glosario colaborativo",d:"Actividad: Glosario. Cada estudiante aporta una definición financiera o de DAX durante el programa. Al final: glosario colaborativo de 50+ términos con ejemplos de datos colombianos. Queda disponible para las cohortes futuras."}]},{section:"Sección 6 — Proyecto Final y Certificación",items:[{icon:"🏆",t:"Entrega del Proyecto Final integrador",d:"Actividad: Tarea avanzada. Entrega: archivo .pbix + informe PDF con narrativa IA verificada + video de sustentación grabado (máx. 15 min). Calificación con rúbrica de 3 dimensiones: dashboard (40%), informe (20%), sustentación (40%)."},{icon:"🎙️",t:"Sustentación en vivo ante panel evaluador",d:"Actividad: Videoconferencia BigBlueButton programada. Grupos de máx. 5 estudiantes por sesión. Panel de 2-3 evaluadores (docente + invitado externo cuando sea posible). 10 min presentación + 5 min preguntas del panel. Grabación para fines de calidad."},{icon:"📝",t:"Simulacro completo PL-300",d:"Actividad: Cuestionario. 40 preguntas aleatorias de banco de 100+ preguntas. Tiempo: 60 minutos (igual que el examen real). 3 intentos máximo. Retroalimentación detallada al finalizar cada intento, con referencia al dominio PL-300 correspondiente."},{icon:"🎓",t:"Emisión automática del certificado",d:"Actividad: Certificate (mod_certificate). Condición: nota final ≥ 70 y asistencia ≥ 80%. El certificado se genera automáticamente con nombre del estudiante, fecha y firma digital del director del programa. Formato PDF descargable."},{icon:"⭐",t:"Encuesta de satisfacción y mejora continua",d:"Actividad: Retroalimentación (Feedback). Anónima. 10 preguntas: 7 cerradas (escala 1-5) + 3 abiertas. Los resultados son revisados por la dirección del programa para actualización de contenidos. Los estudiantes ven los resultados globales una vez cerrada la cohorte."}]},{section:"Plugins de Moodle Recomendados",items:[{icon:"📹",t:"BigBlueButton",d:"Videoconferencia sincrónica integrada directamente en Moodle. Soporta grabación automática, salas de grupos para talleres y pizarra colaborativa."},{icon:"🎮",t:"H5P",d:"Contenido interactivo: videos con preguntas integradas, tarjetas de memoria (flashcards) para fórmulas DAX, líneas de tiempo de conceptos financieros, y presentaciones interactivas."},{icon:"✅",t:"Checklist (mod_checklist)",d:"Lista de verificación por módulo visible para el estudiante. El docente puede configurar ítems obligatorios (ver video, entregar taller) y opcionales (participar en foro)."},{icon:"📋",t:"Attendance (mod_attendance)",d:"Registro automático de asistencia vinculado a las sesiones BigBlueButton. Genera reporte de porcentaje de asistencia por estudiante para control del requisito mínimo del 80%."},{icon:"📊",t:"Completion Progress (block)",d:"Bloque lateral con barra de progreso visual del estudiante. Muestra actividades completadas vs. pendientes. Muy efectivo para motivar el avance en programas virtuales."},{icon:"🏅",t:"Open Badges / Credly integration",d:"Emisión de insignias digitales verificables al completar cada módulo y al finalizar el programa. Las insignias se comparten directamente en LinkedIn desde Moodle."}]}];(0,s.createRoot)(document.getElementById("root")).render((0,o.jsx)(i.StrictMode,{children:(0,o.jsx)(function(){let[e,n]=(0,i.useState)("estudiante"),[t,r]=(0,i.useState)(1),[a,l]=(0,i.useState)(0),s=u.find(e=>e.id===t),p=c[t],m=d[t];return(0,o.jsxs)("div",{style:{fontFamily:"'Georgia', serif",background:"#F8F7F4",minHeight:"100vh"},children:[(0,o.jsx)("header",{style:{background:"#1A2B4A",color:"#fff"},children:(0,o.jsxs)("div",{style:{maxWidth:1100,margin:"0 auto",padding:"
